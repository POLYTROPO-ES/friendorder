<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FriendOrder — configura tu burger" />
    <meta name="theme-color" content="#ff5722" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>FriendOrder</title>
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand" data-i18n="brand">🍔 FriendOrder</h1>
      <div class="topbar-actions">
        <button id="lang-toggle" class="pill" type="button" aria-label="Switch language">EN</button>
        <button id="btn-help" class="pill" type="button" aria-label="Ayuda">❓</button>
        <div class="menu">
          <button id="menu-toggle" class="pill" type="button" aria-haspopup="true" aria-expanded="false">⋯</button>
          <div id="menu-pop" class="menu-pop" hidden>
            <button id="action-export" type="button" data-i18n="export">Exportar</button>
            <button id="action-import" type="button" data-i18n="import">Importar</button>
            <button id="action-delete" class="danger" type="button" data-i18n="deleteAll">Borrar todo</button>
          </div>
        </div>
        <input id="import-file" type="file" accept="application/json,.json" hidden />
      </div>
    </header>

    <main class="content">
      <section class="card preview-card">
        <h2 data-i18n="previewTitle">Tu burger</h2>
        <input
          id="order-name"
          class="order-name"
          type="text"
          maxlength="60"
          autocomplete="off"
          placeholder="Ej: Pepe order"
          aria-label="Nombre del pedido"
        />
        <div class="preview-wrap">
          <canvas id="burger-canvas" width="480" height="560"></canvas>
        </div>
        <p id="summary" class="summary"></p>
        <p id="order-date" class="order-date" hidden></p>
      </section>

      <section class="card">
        <h2 data-i18n="breadTitle">Pan</h2>
        <div id="bread-options" class="segmented"></div>
        <div id="grill-wrap" class="grill-wrap">
          <label class="switch-row">
            <span data-i18n="grillBread">Pan tostado a la plancha</span>
            <input id="grill-toggle" type="checkbox" />
          </label>
        </div>
        <div class="grill-wrap">
          <label class="switch-row">
            <span data-i18n="toppingsAparte">Toppings aparte</span>
            <input id="toppings-aside-toggle" type="checkbox" />
          </label>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="pattiesTitle">Nº de carnes</h2>
        <div id="patty-stepper" class="stepper"></div>
      </section>

      <section class="card">
        <h2 data-i18n="meatTitle">Punto de la carne</h2>
        <div id="meat-options" class="chips"></div>
      </section>

      <section class="card">
        <h2 data-i18n="toppingsTitle">Ingredientes</h2>
        <div id="topping-groups"></div>
      </section>

      <button id="btn-fresh-start" class="fresh-start" type="button">🧹 <span data-i18n="freshStart">Empezar de nuevo</span></button>
    </main>

    <footer class="bottom-bar">
      <button id="btn-download" class="btn primary" type="button">⬇ <span data-i18n="download">Descargar imagen</span></button>
      <button id="btn-whatsapp" class="btn" type="button">💬 <span data-i18n="whatsapp">WhatsApp</span></button>
      <button id="btn-telegram" class="btn" type="button">✈️ <span data-i18n="telegram">Telegram</span></button>
      <button id="btn-copy" class="btn" type="button">🔗 <span data-i18n="copyLink">Copiar enlace</span></button>
    </footer>

    <dialog id="help-dialog" class="help-dialog" aria-labelledby="help-title">
      <div class="help-head">
        <h2 id="help-title" data-i18n="helpTitle">Ayuda</h2>
        <button id="help-close" class="pill" type="button" aria-label="Cerrar">✕</button>
      </div>
      <div class="help-body">
        <section>
          <h3 data-i18n="helpUseTitle">Cómo usar</h3>
          <p data-i18n="helpUseText"></p>
        </section>
        <section>
          <h3 data-i18n="helpShareTitle">Compartir</h3>
          <p data-i18n="helpShareText"></p>
        </section>
        <section>
          <h3 data-i18n="helpDownloadTitle">Descargar imagen</h3>
          <p data-i18n="helpDownloadText"></p>
        </section>
        <section>
          <h3 data-i18n="helpSaveTitle">Guardado</h3>
          <p data-i18n="helpSaveText"></p>
        </section>
        <section>
          <h3 data-i18n="helpDataTitle">Exportar, importar y borrar</h3>
          <p data-i18n="helpDataText"></p>
        </section>
        <section>
          <h3 data-i18n="helpAiTitle">Aviso de IA</h3>
          <p data-i18n="helpAiText"></p>
        </section>
        <section>
          <a id="help-github" class="help-github" href="https://github.com/POLYTROPO-ES/friendorder" target="_blank" rel="noopener" data-i18n="helpGithub">🐙 Ver el código en GitHub</a>
        </section>
        <p id="app-version" class="help-version"></p>
      </div>
    </dialog>

    <dialog id="serve-conflict" class="conflict-dialog" aria-labelledby="conflict-message">
      <p id="conflict-message"></p>
      <div class="conflict-actions">
        <button id="conflict-inside" class="btn primary" type="button"></button>
        <button id="conflict-keep" class="btn" type="button"></button>
      </div>
    </dialog>

    <dialog id="confirm-reset" class="conflict-dialog" aria-labelledby="confirm-reset-message">
      <p id="confirm-reset-message" data-i18n="confirmDelete">¿Borrar todo el estado guardado?</p>
      <div class="conflict-actions">
        <button id="confirm-reset-yes" class="btn primary" type="button" data-i18n="confirmYes">Sí, borrar</button>
        <button id="confirm-reset-no" class="btn" type="button" data-i18n="confirmCancel">Cancelar</button>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
