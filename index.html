<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FriendOrder — a fresh project placeholder." />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FriendOrder</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: 'Segoe UI', Tahoma, system-ui, sans-serif;
        background: #f4f7f2;
        color: #1f2937;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
          color: #e2e8f0;
        }
      }
      .shell {
        text-align: center;
        padding: 2rem;
        max-width: 40rem;
      }
      .logo {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 0.75rem 0 0.25rem;
        font-size: 2rem;
      }
      .tagline {
        margin: 0 0 1rem;
        opacity: 0.8;
      }
      .hint {
        font-size: 0.9rem;
        opacity: 0.7;
      }
      code {
        background: rgba(128, 128, 128, 0.15);
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
      }
      footer {
        margin-top: 2rem;
        font-size: 0.8rem;
        opacity: 0.5;
      }
      .user-area {
        margin: 1.25rem 0;
      }
      .user-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid rgba(128, 128, 128, 0.3);
        border-radius: 999px;
        background: rgba(128, 128, 128, 0.08);
      }
      .avatar {
        width: 2rem;
        height: 2rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #0f766e;
        color: #fff;
        font-weight: 600;
      }
      .user-meta {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        line-height: 1.2;
      }
      .user-name {
        font-weight: 600;
      }
      .user-email {
        font-size: 0.8rem;
        opacity: 0.7;
      }
      .role-badge {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        border: 1px solid currentColor;
      }
      .role-admin {
        color: #0f766e;
      }
      .role-user {
        color: #64748b;
      }
      .logout-link {
        font-size: 0.8rem;
      }
      .admin-panel {
        margin-top: 1.5rem;
        text-align: left;
      }
      .admin-panel h2 {
        font-size: 1.1rem;
        margin: 0 0 0.5rem;
      }
      .admin-error {
        color: #b91c1c;
        font-size: 0.85rem;
      }
      .table-wrap {
        overflow-x: auto;
        border: 1px solid rgba(128, 128, 128, 0.25);
        border-radius: 8px;
      }
      .members-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
      }
      .members-table th,
      .members-table td {
        padding: 0.5rem 0.75rem;
        text-align: left;
        border-bottom: 1px solid rgba(128, 128, 128, 0.15);
      }
      .members-table tr:last-child td {
        border-bottom: none;
      }
      .members-table th {
        opacity: 0.7;
        font-weight: 600;
      }
      .role-toggle {
        font-size: 0.8rem;
        padding: 0.25rem 0.6rem;
        border-radius: 6px;
        border: 1px solid currentColor;
        background: transparent;
        cursor: pointer;
      }
      .role-toggle:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .github-corner {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 10;
      }
      .github-corner svg {
        fill: #151513;
        color: #fff;
        width: 80px;
        height: 80px;
      }
      .github-corner:hover .octo-arm {
        animation: octocat-wave 560ms ease-in-out;
      }
      @keyframes octocat-wave {
        0%,
        100% {
          transform: rotate(0);
        }
        20%,
        60% {
          transform: rotate(-25deg);
        }
        40%,
        80% {
          transform: rotate(10deg);
        }
      }
      @media (max-width: 500px) {
        .github-corner:hover .octo-arm {
          animation: none;
        }
        .github-corner .octo-arm {
          animation: octocat-wave 560ms ease-in-out;
        }
      }
    </style>
  </head>
  <body>
    <a href="https://github.com/POLYTROPO-ES/friendorder" class="github-corner" aria-label="Fork me on GitHub" target="_blank" rel="noopener">
      <svg viewBox="0 0 250 250" aria-hidden="true">
        <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
        <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
        <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"></path>
      </svg>
    </a>
    <main class="shell">
      <img class="logo" src="/favicon.svg" alt="FriendOrder" />
      <h1>FriendOrder</h1>
      <p class="tagline">A fresh start.</p>
      <div id="user-area" class="user-area"></div>
      <section id="admin-panel" class="admin-panel" hidden>
        <h2>Members</h2>
        <p id="admin-error" class="admin-error" hidden></p>
        <div class="table-wrap">
          <table class="members-table">
            <thead>
              <tr>
                <th>Email</th>
                <th>Name</th>
                <th>Role</th>
                <th>Last login</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
      <p class="hint">Edit <code>index.html</code> to build your page, then deploy with <code>npm run deploy:cf</code>.</p>
      <footer><span id="version"></span></footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
